<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Online Learning — Main Menu</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="menu">
      <img src="logo_news.png" alt="Caritas Wu Cheng-Chung College Logo" style="max-width:500px;width:100%;height:auto;margin-bottom:1rem;">
      <h1 class="title">Online Learning Platform</h1>
      <p style="font-size:0.95rem;color:var(--muted);margin-bottom:1.5rem;">Topic - Potential Energy, Kinetic Energy and Friction</p>

      <div class="buttons" role="navigation" aria-label="Main menu">
        <button class="btn btn-primary" id="videoBtn" aria-label="Video lessons">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M8 5v14l11-7L8 5z" fill="currentColor" />
          </svg>
          <span>Video</span>
        </button>

        <button class="btn btn-secondary" id="quizBtn" aria-label="Quizzes">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 2a7 7 0 00-7 7v2a5 5 0 005 5h1v3l3-3h2a3 3 0 003-3v-4a7 7 0 00-7-7z" fill="currentColor" />
          </svg>
          <span>Quiz</span>
        </button>

        <!-- Competition guidelines button opens PDF in new tab -->
        <button class="btn btn-tertiary" id="guidelinesBtn" aria-label="Competition Guidelines">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 2h9l5 5v15a1 1 0 01-1 1H6a1 1 0 01-1-1V3a1 1 0 011-1z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 2v6h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 12h6M9 16h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Competition Guidelines</span>
        </button>
      </div>
    </main>

    <script src="script.js?v=2.0"></script>
  </body>
</html>
